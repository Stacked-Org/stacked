name: Test Package

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lint_and_test:
    name: Linting and Testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: dart fix --apply
      # - run: flutter analyze # removing analyze for now, we only care about test passing
      - run: flutter test --coverage
      - name: Setup LCOV
        uses: hrishikesh-kadam/setup-lcov@v1
      - name: Report code coverage
        uses: zgosalvez/github-actions-report-lcov@v7
        with:
          coverage-files: coverage/lcov*.info
          artifact-name: code-coverage-report
          # The coverage comment needs write access, which the default token
          # does not have for pull requests opened from forks. Only pass the
          # token for same-repository branches so fork PRs don't fail here.
          github-token: ${{ github.event.pull_request.head.repo.full_name == github.repository && secrets.GITHUB_TOKEN || '' }}
          update-comment: true
